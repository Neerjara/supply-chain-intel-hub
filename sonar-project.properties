# Supply Chain Intelligence Hub (SCIH) - Root SonarQube Configuration
sonar.projectKey=scih-root
sonar.projectName=Supply Chain Intelligence Hub (Root)
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Modules Breakdown
sonar.modules=src/web,src/api,src/workers

# Global Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/bin/**,**/obj/**,**/*.dll,**/coverage/**,**/playwright-report/**

# Coverage Exclusion Rules
sonar.coverage.exclusions=**/*.spec.ts,**/*.test.tsx,**/Migrations/**,**/Program.cs,**/scripts/**
