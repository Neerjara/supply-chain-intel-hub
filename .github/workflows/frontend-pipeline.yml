name: Pipeline - React Frontend (CI/CD)

on:
  push:
    branches: [ main ]
    paths:
      - 'src/web/**'
      - '.github/workflows/frontend-pipeline.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/web/**'

jobs:
  # Stage 1: Build & Test React Frontend
  build-and-test:
    name: Build & Test React App
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'src/web/package.json'

      - name: Install Dependencies
        working-directory: ./src/web
        run: npm ci

      - name: Typecheck TypeScript
        working-directory: ./src/web
        run: npm run typecheck

      - name: Build Application
        working-directory: ./src/web
        run: npm run build

  # Stage 2: SonarQube Code Scan
  sonarqube-analysis:
    name: SonarQube Scan
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan Action
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=scih-web
            -Dsonar.sources=src/web/src
            -Dsonar.exclusions=src/web/node_modules/**,src/web/dist/**

  # Stage 3: Deploy to Azure Static Web Apps
  deploy-static-web-app:
    name: Deploy to Azure Static Web Apps
    needs: [build-and-test, sonarqube-analysis]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build and Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/src/web"
          api_location: ""
          output_location: "dist"
