name: CI - Backend (.NET 8)

on:
  pull_request:
    paths:
      - 'src/api/**'
      - 'src/workers/**'
      - 'Directory.Build.props'
      - '.github/workflows/ci-backend.yml'
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore SCIH.sln

      - name: Build Solution
        run: dotnet build SCIH.sln --configuration Release --no-restore

      - name: Run Unit Tests
        run: dotnet test SCIH.sln --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"
