version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/src/api"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/src/web"
    schedule:
      interval: "weekly"

  - package-ecosystem: "terraform"
    directory: "/infra"
    schedule:
      interval: "monthly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
