# SCIH Worker Service SonarQube Configuration
sonar.projectKey=scih-worker
sonar.projectName=SCIH .NET Worker Service
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Source directories
sonar.sources=SCIH.Worker

# C# OpenCover Code Coverage Report Integration
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml

# Exclusions
sonar.exclusions=bin/**,obj/**,**/appsettings*.json
sonar.coverage.exclusions=**/Program.cs,**/SCIH.Worker.csproj
