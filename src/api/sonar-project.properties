# SCIH Web API SonarQube Configuration
sonar.projectKey=scih-api
sonar.projectName=SCIH ASP.NET Core Web API
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Source directories
sonar.sources=SCIH.Api,SCIH.Application,SCIH.Domain,SCIH.Infrastructure

# C# OpenCover Code Coverage Report Integration
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml

# Exclusions
sonar.exclusions=bin/**,obj/**,**/Migrations/**,**/appsettings*.json
sonar.coverage.exclusions=**/Migrations/**,**/Program.cs,**/SCIH.Api.csproj
