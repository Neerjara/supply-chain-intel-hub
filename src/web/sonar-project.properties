# SCIH React Frontend SonarQube Configuration
sonar.projectKey=scih-web
sonar.projectName=SCIH React Frontend
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Source and Test directories
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# TypeScript & LCOV Code Coverage Integration
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Exclusions
sonar.exclusions=node_modules/**,dist/**,build/**,public/**,**/*.d.ts,vite.config.ts
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,src/main.tsx,src/vite-env.d.ts
